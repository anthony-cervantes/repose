dependencies {
    api project(":repose-aggregator:core:repose-core-api")
    api project(":repose-aggregator:commons:commons-utilities")
    api project(":repose-aggregator:commons:commons-configuration")
    api "org.slf4j:slf4j-api"
    api "org.slf4j:jcl-over-slf4j"
    api "org.springframework:spring-beans"
    api "org.springframework:spring-web"
    api "net.sf.saxon:Saxon-EE"
    api "com.fasterxml.jackson.core:jackson-core"
    api "commons-pool:commons-pool"
    api "xalan:xalan"
    api "xerces:xerces-xsd11"

    compileOnly "jakarta.servlet:jakarta.servlet-api"
    compileOnly "jakarta.inject:jakarta.inject-api"

    testImplementation "junit:junit"
    testImplementation "org.scala-lang:scala-library"
    testImplementation "org.scalatest:scalatest_$scalaMajDotMin"
    testImplementation "org.scalatestplus:junit-4-13_$scalaMajDotMin"
    testImplementation "org.scalatestplus:mockito-5-23_$scalaMajDotMin"
    testImplementation "org.apache.groovy:groovy-all"
    testImplementation "org.hamcrest:hamcrest"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.springframework:spring-test"
    testImplementation "commons-io:commons-io"
    testImplementation "org.xmlunit:xmlunit-matchers"
    testImplementation "org.spockframework:spock-core"
}

license {
    excludes(["version.properties", "configuration.xml", "pipeline-library.xml", "request-post-process.xsl", "xml.xsd",
              "xproc-papi.xsd", "xproc.xsd", "query-parameters.xml", "post_server_req_v1.0.xml", "headers.xml",
              "request.xml", "post_server_req_v1.1.xsl", "add-element.xsl", "empty.xml", "identity.xsl",
              "remove-me-element.xml", "remove-element.xsl", "style.xsl", "request-information.xml"].collect {"**/$it"})
}

jacocoTestCoverageVerification {
    violationRules {
        rules.forEach { rule ->
            rule.limits.forEach { limit ->
                if (limit.counter == 'INSTRUCTION' && limit.value == 'COVEREDRATIO') {
                    // todo: set to the current coverage -- need more coverage, but we don't want the build to fail for the baseline
                    limit.minimum = 0.59
                }
            }
        }
    }
}
