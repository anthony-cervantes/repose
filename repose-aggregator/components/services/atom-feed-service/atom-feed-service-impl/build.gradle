dependencies {
    api project(":repose-aggregator:core:repose-core-api")
    api project(":repose-aggregator:components:services:atom-feed-service:atom-feed-service-api")
    api project(':repose-aggregator:components:services:http-client-service:http-client-service-api')
    api project(":repose-aggregator:commons:commons-utilities")
    api "org.slf4j:slf4j-api"
    api "com.typesafe.scala-logging:scala-logging_$scalaMajDotMin"
    api "org.slf4j:jcl-over-slf4j"
    api "org.scala-lang:scala-library"
    api "org.apache.pekko:pekko-actor_$scalaMajDotMin"
    api "org.apache.abdera:abdera-core"
    api "org.apache.abdera:abdera-parser"
    api "org.springframework:spring-beans"
    api "org.springframework:spring-context"
    api "org.playframework:play-json_$scalaMajDotMin"
    api "org.apache.httpcomponents:httpclient"
    api "org.apache.httpcomponents:httpcore"
    api "io.opentracing:opentracing-api"

    compileOnly "jakarta.servlet:jakarta.servlet-api"
    compileOnly "jakarta.inject:jakarta.inject-api"
    compileOnly "jakarta.ws.rs:jakarta.ws.rs-api"
    compileOnly "com.google.code.findbugs:jsr305" //i hate this hack

    testImplementation project(":repose-aggregator:commons:commons-test")
    testImplementation "junit:junit"
    testImplementation "org.scalatest:scalatest_$scalaMajDotMin"
    testImplementation "org.scalatestplus:junit-4-13_$scalaMajDotMin"
    testImplementation "org.scalatestplus:mockito-5-23_$scalaMajDotMin"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.apache.logging.log4j:log4j-slf4j2-impl"
    testImplementation "org.apache.logging.log4j:log4j-core"
    testImplementation "org.apache.logging.log4j:log4j-core-test"
    testImplementation "org.apache.pekko:pekko-testkit_$scalaMajDotMin"
    testImplementation "org.springframework:spring-test"
}

jacocoTestCoverageVerification {
    violationRules {
        rules.forEach { rule ->
            rule.limits.forEach { limit ->
                if (limit.counter == 'INSTRUCTION' && limit.value == 'COVEREDRATIO') {
                    // todo: set to the current coverage -- need more coverage, but we don't want the build to fail for the baseline
                    limit.minimum = 0.31
                }
            }
        }
    }
}
