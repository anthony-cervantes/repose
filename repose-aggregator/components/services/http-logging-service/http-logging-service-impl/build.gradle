dependencies {
    api project(":repose-aggregator:components:services:http-logging-service:http-logging-service-api")
    api project(":repose-aggregator:core:repose-core-api")
    api "com.fasterxml.jackson.core:jackson-core"
    api "com.google.guava:guava" // Forces the version used by jtwig-core
    api "org.playframework:play-json_$scalaMajDotMin"
    api "com.typesafe.scala-logging:scala-logging_$scalaMajDotMin"
    api "org.jtwig:jtwig-core"
    api "org.parboiled:parboiled-java"
    api platform("org.ow2.asm:asm-bom")
    api "org.scala-lang:scala-library"

    compileOnly "jakarta.inject:jakarta.inject-api"
    compileOnly "jakarta.servlet:jakarta.servlet-api"

    testImplementation "junit:junit"
    testImplementation "org.apache.logging.log4j:log4j-slf4j2-impl"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.scalatest:scalatest_$scalaMajDotMin"
    testImplementation "org.scalatestplus:junit-4-13_$scalaMajDotMin"
    testImplementation "org.scalatestplus:mockito-5-23_$scalaMajDotMin"
    testImplementation "org.springframework:spring-test"
}
