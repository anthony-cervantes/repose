dependencies {
    api project(':repose-aggregator:core:repose-core-api')
    api project(':repose-aggregator:commons:commons-utilities')
    api project(':repose-aggregator:commons:commons-configuration')
    api 'org.apache.groovy:groovy-all'
    api 'org.rackspace:deproxy'
    api 'org.spockframework:spock-core'
    api 'org.apache.commons:commons-lang3'
    api 'org.springframework:spring-web'
    api 'javax.ws.rs:javax.ws.rs-api'
    api 'joda-time:joda-time'
    api 'org.linkedin:org.linkedin.util-groovy'
    api 'com.squareup.okhttp3:okhttp' // Forces the version used by jaeger-core.
    api 'org.apache.thrift:libthrift' // Forces the version used by jaeger-core.
    api 'io.jaegertracing:jaeger-core'
    api 'io.jaegertracing:jaeger-thrift'
    api 'jakarta.servlet:jakarta.servlet-api'
}

processResources {
    expand(
        version: version,
    )
}


license {
    excludes(['**/credentials.xsd', '**/atom.xsd', '**/xml.xsd'])
}

jacocoTestCoverageVerification {
    violationRules {
        rules.forEach { rule ->
            rule.limits.forEach { limit ->
                if (limit.counter == 'INSTRUCTION' && limit.value == 'COVEREDRATIO') {
                    // todo: set to the current coverage -- need more coverage, but we don't want the build to fail for the baseline
                    limit.minimum = 0.00
                }
            }
        }
    }
}

dependencyCheck {
    skip = true
}
