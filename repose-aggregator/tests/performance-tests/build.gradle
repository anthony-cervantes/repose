import org.apache.tools.ant.filters.ReplaceTokens

testSets {
    performanceTest
}

sourceSets.performanceTest.resources.exclude '**/node_modules/**', '**/__pycache__/**', '**/*.pyc'

configurations {
    gatlingRuntime {
        canBeConsumed = false
    }
}

dependencies {
    //todo: not certain why this was neccessary, but it lets things compile
    testCompileOnly 'org.scala-lang:scala-library:3.10.0'

    performanceTestImplementation project(':repose-aggregator:tests:performance-test-framework')
    performanceTestCompileOnly 'org.scala-lang:scala-library:3.10.0'
    performanceTestCompileOnly 'io.gatling:gatling-core'
    performanceTestCompileOnly 'io.gatling:gatling-http'

    gatlingRuntime 'io.gatling:gatling-app'
    gatlingRuntime 'io.gatling.highcharts:gatling-charts-highcharts'
    gatlingRuntime project(path: ':repose-aggregator:tests:performance-test-framework', configuration: 'runtimeElements')
}

license {
    exclude "**/*.json"
    exclude "**/*.yaml"
    exclude "**/saml*.xml"
    exclude "**/*.xsl"
}

processPerformanceTestResources {
    //INFO: We'd like to use the more standard gradle 'expand( docsHome: docsHome)',
    // however it chokes pretty hard on the regexs we sprinkle into our xml specifically the `\`.
    // Instead I've elected to use ant based filtering.
    filter(ReplaceTokens, tokens: [gatlingVersion: versionProperties.get('gatlingVersion')])
}

tasks.named('performanceTestJar', Jar) {
    archiveClassifier = 'performance-tests'
}

task buildAnsibleDirectory(type: Copy, dependsOn: ["processPerformanceTestResources", "performanceTestJar"]) {
    into "$buildDir/ansible_root"

    from(processPerformanceTestResources.outputs)

    from(configurations.gatlingRuntime) {
        into "/roles/gatling/files/libs"
    }
    from(performanceTestJar) {
        into "/roles/gatling/files/libs"
    }

    from(rootProject.file('repose-aggregator/tests/release-verification/src/scripts/node_install.sh')) {
        into '/roles/repose/files'
    }
}

// todo: do not produce (or at least, do not publish) any artifacts for this project

dependencyCheck {
    skip = true
}
