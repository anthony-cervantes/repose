- name: Copy the Node.js installer
  copy:
    src: node_install.sh
    dest: /tmp/repose-node-install.sh
    mode: '0755'

- name: Install Node.js 22
  command: /bin/sh /tmp/repose-node-install.sh
  environment:
    REPOSE_NODE_VERSION: "{{ nodejs.version }}"
  args:
    creates: "/usr/local/lib/node-v{{ nodejs.version }}-linux-{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'x64' }}/bin/node"
  become: yes

- name: Install build-essential
  apt:
    pkg: build-essential
    state: latest
    update_cache: yes
    cache_valid_time: 86400

- name: Create mocks directory
  file: path=/opt/mocks state=directory

- name: Copy the mocks
  copy:
    src: mocks/{{ item }}
    dest: /opt/mocks/{{ item | basename }}
    mode: 0640
  with_items: "{{ mock.backends }}"

- name: Copy the package.json
  copy: src=mocks/{{ mock.npm_package_file }} dest=/opt/mocks/package.json

- name: Copy the response payloads
  copy: src=mocks/{{ item }} dest=/opt/mocks/{{ item | basename }}
  with_items: "{{ mock.payloads }}"

- name: Copy the dependency lockfile
  copy: src=mocks/{{ mock.npm_lock_file }} dest=/opt/mocks/package-lock.json

- name: Install Node.js dependencies for the mocks
  command: /usr/local/bin/npm ci
  args:
    chdir: /opt/mocks
