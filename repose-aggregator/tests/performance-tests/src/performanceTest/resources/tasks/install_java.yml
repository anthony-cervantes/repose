- name: Install Java repository prerequisites
  apt:
    name: [ca-certificates, wget]
    state: present
    update_cache: yes
  become: yes

- name: Install the Adoptium signing key
  get_url:
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public
    dest: /usr/share/keyrings/adoptium.asc
    mode: '0644'
  become: yes

- name: Configure the Adoptium repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/adoptium.asc] https://packages.adoptium.net/artifactory/deb {{ ansible_distribution_release }} main"
    filename: adoptium
    state: present
  become: yes

- name: Install Java 27
  apt:
    name: temurin-27-jdk
    state: present
    update_cache: yes
  become: yes
