apply plugin: 'com.gradleup.shadow'

configurations {
    fatJar
}

dependencies {
    api project(':repose-aggregator:commons:commons-utilities')
    api project(':repose-aggregator:components:services:datastore-service:datastore-service-api')
    api project(':repose-aggregator:core:repose-core-api')
    api "org.slf4j:slf4j-api"

    testImplementation "junit:junit"
    testImplementation "org.hamcrest:hamcrest"
}

jar {
    manifest {
        attributes 'Main-Class': 'org.openrepose.cli.CommandDriver'
    }
}

shadowJar {
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

artifacts {
    fatJar shadowJar
}

build.dependsOn shadowJar

// The CLI JAR remains available to developers, but has no native package.
publishing {
    publications {
        nebula(MavenPublication) {
            artifact shadowJar
        }
    }
}

jacocoTestCoverageVerification {
    violationRules {
        // todo: coverage is currently around 9% -- it is known, but should not fail the build
        setFailOnViolation(false)
    }
}
