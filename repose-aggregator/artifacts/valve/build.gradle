apply plugin: 'com.gradleup.shadow'

configurations {
    fatJar
}

dependencies {
    api project(":repose-aggregator:core:repose-core-api")
    api project(":repose-aggregator:commons:commons-configuration")
    api project(":repose-aggregator:commons:commons-utilities")
    api project(":repose-aggregator:components:services:http-logging-service:http-logging-service-api")
    api project(":repose-aggregator:core:repose-core")
    api "org.scala-lang:scala-library"
    api "com.typesafe.scala-logging:scala-logging_$scalaMajDotMin"
    api "org.slf4j:jcl-over-slf4j"
    api "com.github.scopt:scopt_$scalaMajDotMin"
    api "com.typesafe:config"
    api "org.springframework:spring-core"
    api "org.springframework:spring-context"
    api "org.springframework:spring-web"
    api "org.springframework:spring-beans"
    api "org.eclipse.jetty.ee11:jetty-ee11-servlet"
    api "org.eclipse.jetty:jetty-server"
    api "org.eclipse.jetty:jetty-util"

    compileOnly "jakarta.inject:jakarta.inject-api"

    testImplementation "junit:junit"
    testImplementation "org.scalatest:scalatest_$scalaMajDotMin"
    testImplementation "org.scalatestplus:junit-4-13_$scalaMajDotMin"
    testImplementation "org.scalatestplus:mockito-5-23_$scalaMajDotMin"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.apache.httpcomponents:httpclient"
}

processResources {
    inputs.property('reposeVersion', version.toString())
    inputs.property('jettyVersion', versionProperties.get('jettyVersion'))
    expand(reposeVersion: version, jettyVersion: versionProperties.get('jettyVersion'))
}


jar {
    manifest {
        attributes 'Main-Class': 'org.openrepose.valve.Main'
    }
}

shadowJar {
    archiveFileName = 'repose.jar'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat'
}

artifacts {
    fatJar shadowJar
}

build.dependsOn shadowJar

// Preserve the local development publication; deployment is through GHCR.
publishing {
    publications {
        nebula(MavenPublication) {
            artifact(shadowJar) {
                classifier = 'all'
            }
        }
    }
}

tasks.named('test') {
    doFirst {
        systemProperty 'repose.main.classpath', sourceSets.main.runtimeClasspath.asPath
    }
}
