import org.apache.tools.ant.filters.ReplaceTokens

configurations {
    containerValve {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    containerBundles {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def valveProject = project(':repose-aggregator:artifacts:valve')
def bundleNames = ['filter-bundle', 'extensions-filter-bundle', 'experimental-filter-bundle']

dependencies {
    containerValve project(path: ':repose-aggregator:artifacts:valve', configuration: 'fatJar')
    bundleNames.each { bundle ->
        containerBundles project(path: ":repose-aggregator:artifacts:$bundle", configuration: 'containerBundle')
    }
}

// One Docker context: executable JAR, filter EARs, configs and license notices.
// Sync removes stale files after version changes. No package-manager archives,
// native service files, signing, or external publication tasks are involved.
tasks.register('stageGhcrContext', Sync) {
    group = 'build'
    description = 'Stage the Repose Docker image directly from JVM artifacts'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    into layout.buildDirectory.dir('docker/ghcr')

    from('src/docker/resources/ghcr/Dockerfile')
    from(configurations.containerValve) {
        into 'rootfs/usr/share/repose'
    }
    from(configurations.containerBundles) {
        into 'rootfs/usr/share/repose/filters'
    }
    from(valveProject.file('src/config/filters')) {
        into 'rootfs/etc/repose'
        filter(ReplaceTokens, tokens: [docsHome: project.docsHome.toString()])
    }
    from(valveProject.file('src/config/filters')) {
        into 'rootfs/etc/repose/examples'
        filter(ReplaceTokens, tokens: [docsHome: project.docsHome.toString()])
    }
    from(valveProject.file('src/config/scripts/clean-repose-deploy')) {
        into 'rootfs/usr/share/repose'
    }

    from(rootProject.file('LICENSE.txt'), rootProject.file('CONTRIBUTORS.txt'),
            valveProject.file('src/config/docs/DEPENDENCIES.txt')) {
        into 'rootfs/usr/share/doc/repose'
    }
    bundleNames.each { bundle ->
        def bundleProject = project(":repose-aggregator:artifacts:$bundle")
        from(bundleProject.file('src/config/filters')) {
            into 'rootfs/etc/repose/examples'
        }
        from(rootProject.file('LICENSE.txt'), rootProject.file('CONTRIBUTORS.txt'),
                bundleProject.file('src/config/docs/DEPENDENCIES.txt')) {
            into "rootfs/usr/share/doc/repose-$bundle"
        }
    }
}
