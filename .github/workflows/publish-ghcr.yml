name: Repose Docker

on:
  pull_request:
  workflow_dispatch:
    inputs:
      dependency_audit:
        description: 'Clean-cache dependency provenance and targeted coverage/test probes'
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: repose-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27.0.1.1+4'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            settings.gradle
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
      - name: Build and verify Docker image (no publishing)
        if: ${{ !startsWith(github.head_ref, 'audit/') && !inputs.dependency_audit }}
        run: bash scripts/build-container.sh repose:ci
      - name: Clean-cache dependency audit and Docker verification (no publishing)
        if: ${{ startsWith(github.head_ref, 'audit/') || inputs.dependency_audit }}
        run: bash scripts/audit-dependencies.sh

  saxon-he-candidate:
    # Deliberately separate from the release/default EE validation.
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/saxon-he') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_saxonHeCandidate: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27.0.1.1+4'
      - name: Verify the HE-only candidate from a clean cache (no publishing)
        run: bash scripts/audit-dependencies.sh

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '27.0.1.1+4'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            settings.gradle
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
      - name: Build and verify release image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          bash scripts/build-container.sh "$image:$version" "$version"
      - name: Publish verified image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          revision="${GITHUB_SHA:0:12}"
          docker tag "$image:$version" "$image:sha-$revision"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$version"
          docker push "$image:sha-$revision"
          {
            printf 'Published `%s` and `%s`\n' "$image:$version" "$image:sha-$revision"
            docker image inspect "$image:$version" --format '{{range .RepoDigests}}{{println .}}{{end}}'
          } >> "$GITHUB_STEP_SUMMARY"
