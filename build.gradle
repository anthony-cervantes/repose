buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }

    dependencies {
        classpath 'org.unbroken-dome.gradle-plugins:gradle-testsets-plugin:4.1.0'
        classpath 'com.netflix.nebula:nebula-dependency-recommender:14.3.0'
        classpath 'org.scoverage:gradle-scoverage:9.1'
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
        classpath 'com.github.alisiikh:gradle-scalastyle-plugin:3.5.0'
        classpath 'gradle.plugin.com.hierynomus.gradle.plugins:license-gradle-plugin:0.16.1'
        classpath 'com.netflix.nebula:nebula-publishing-plugin:23.2.0'
        classpath 'com.netflix.nebula:gradle-git-scm-plugin:6.1.0'
        classpath 'com.netflix.nebula:gradle-ospackage-plugin:14.0.2'
        classpath 'com.bmuschko:gradle-docker-plugin:10.0.0'
        classpath 'org.owasp:dependency-check-gradle:13.0.0'
    }
}

apply plugin: 'com.netflix.nebula.gradle-git-scm'

// Keep existing version lookups and Nebula recommendations backed by the
// standard Gradle catalog, which Dependabot can read and update directly.
def dependencyCatalog = extensions.getByType(VersionCatalogsExtension).named('libs')
project.ext.versionProperties = new Properties()
def catalogRecommendations = [:]
dependencyCatalog.versionAliases.each { alias ->
    versionProperties.setProperty(alias, dependencyCatalog.findVersion(alias).get().requiredVersion)
}
dependencyCatalog.libraryAliases.each { alias ->
    def dependency = dependencyCatalog.findLibrary(alias).get().get()
    def module = dependency.module.toString()
    def requiredVersion = dependency.versionConstraint.requiredVersion
    versionProperties.setProperty(module, requiredVersion)
    catalogRecommendations[module] = requiredVersion
}

ext {
    reposeCodename = "Falco"
    scalaMajDotMin = '3'
}

configurations {
    debBundle
    rpmBundle
}

dependencies {
    debBundle project(path: ':repose-aggregator:artifacts:cli-utils', configuration: 'deb')
    debBundle project(path: ':repose-aggregator:artifacts:valve', configuration: 'deb')
    debBundle project(path: ':repose-aggregator:artifacts:filter-bundle', configuration: 'deb')
    debBundle project(path: ':repose-aggregator:artifacts:extensions-filter-bundle', configuration: 'deb')
    debBundle project(path: ':repose-aggregator:artifacts:experimental-filter-bundle', configuration: 'deb')

    rpmBundle project(path: ':repose-aggregator:artifacts:cli-utils', configuration: 'rpm')
    rpmBundle project(path: ':repose-aggregator:artifacts:valve', configuration: 'rpm')
    rpmBundle project(path: ':repose-aggregator:artifacts:filter-bundle', configuration: 'rpm')
    rpmBundle project(path: ':repose-aggregator:artifacts:extensions-filter-bundle', configuration: 'rpm')
    rpmBundle project(path: ':repose-aggregator:artifacts:experimental-filter-bundle', configuration: 'rpm')
}

task('buildAll', description: 'Builds all the sub-projects.', group: 'release')

task('tagVersion', description: 'Tag the repository with the current version.', group: 'release', dependsOn: [buildAll]) {
    doLast {
        scmFactory.create().tag(version)
    }
}

//This populates the version number so that jenkins can grab it and send it on to the release verification job
task('exportVersion', description: 'Write the current build version out to a properties file.') {
    doLast {
        file("$rootDir/repose-aggregator/build/release-version.properties").text = 'RELEASE_VERSION=' + version + System.lineSeparator()
    }
}

task('publishToPackageRepo', group: 'publishing') {
    description 'Publishes the DEB and RPM packages to the package repository'
    dependsOn configurations.debBundle, configurations.rpmBundle, buildAll

    doLast {
        ['nexus.openrepose.username', 'nexus.openrepose.password'].each { name ->
            if (!project.hasProperty(name)) {
                throw new GradleException('The "' + name + '" property is required')
            }
        }
        def credentials = project.property('nexus.openrepose.username') + ':' + project.property('nexus.openrepose.password')
        def upload = { File artifact, String method, String path ->
            def connection = new URL('https://nexus.openrepose.org' + path).openConnection()
            connection.requestMethod = method
            connection.doOutput = true
            connection.setRequestProperty('Authorization', 'Basic ' + credentials.getBytes('UTF-8').encodeBase64())
            connection.setRequestProperty('Content-Type', 'application/octet-stream')
            connection.setFixedLengthStreamingMode(artifact.length())
            try {
                connection.outputStream.withCloseable { output ->
                    artifact.withInputStream { input -> output << input }
                }
                if (connection.responseCode < 200 || connection.responseCode >= 300) {
                    throw new GradleException('Failed to upload ' + artifact.name + ': HTTP ' + connection.responseCode)
                }
                logger.lifecycle 'Successfully uploaded {}', artifact.name
            } finally {
                connection.disconnect()
            }
        }
        configurations.rpmBundle.files.each { upload(it, 'PUT', '/repository/el/' + it.name) }
        configurations.debBundle.files.each { upload(it, 'POST', '/repository/debian/') }
    }
}

task('release', description: 'Release the project and publish to all repos.', group: 'release', dependsOn: [exportVersion, tagVersion, publishToPackageRepo])

allprojects {
    group = 'org.openrepose'
    def baseVersion = '10.1.1'
    // Container packaging uses the stable version without invoking legacy Maven
    // publication/signature configuration. It does not publish Maven artifacts.
    version = (project.hasProperty('release') || project.hasProperty('containerRelease')) ? baseVersion : "$baseVersion~SNAPSHOT"

    apply plugin: 'idea'
    apply plugin: 'com.netflix.nebula.dependency-recommender'
    apply from: rootProject.file('gradle/jakarta-servlet.gradle')

    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('net.sf.ehcache:ehcache-core') using module(
                "net.sf.ehcache:ehcache:${rootProject.versionProperties.get('net.sf.ehcache:ehcache')}")
            ['hamcrest-core', 'hamcrest-library'].each { artifact ->
                substitute module("org.hamcrest:$artifact") using module(
                    "org.hamcrest:hamcrest:${rootProject.versionProperties.get('org.hamcrest:hamcrest')}")
            }
            all { substitution ->
                def requested = substitution.requested
                if (requested instanceof org.gradle.api.artifacts.component.ModuleComponentSelector &&
                        requested.group == 'org.codehaus.groovy') {
                    substitution.useTarget("org.apache.groovy:${requested.module}:${rootProject.versionProperties.get('org.apache.groovy:groovy-all')}")
                }
            }
            substitute module('org.apache.logging.log4j:log4j-slf4j-impl') using module(
                "org.apache.logging.log4j:log4j-slf4j2-impl:${rootProject.versionProperties.get('log4jVersion')}")
            ['play-json', 'play-functional'].each { artifact ->
                substitute module("com.typesafe.play:${artifact}_$scalaMajDotMin") using module(
                    "org.playframework:${artifact}_$scalaMajDotMin:${rootProject.versionProperties.get('org.playframework:play-json_3')}")
            }
        }
    }

    repositories {
        mavenCentral()
        maven {
            url "https://maven.research.rackspacecloud.com/content/groups/aggregate/"
        }
        maven {
            url 'https://build.shibboleth.net/nexus/content/repositories/releases'
        }
    }

    ext {
        docsHome = "http://www.openrepose.org/versions/$version/index.html".toString()
    }
}

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply plugin: 'scala'
    apply plugin: 'org.unbroken-dome.test-sets'
    apply from: rootProject.file('gradle/jaxb.gradle')
    apply plugin: 'checkstyle'
    apply plugin: 'codenarc'
    apply plugin: 'com.github.alisiikh.scalastyle'
    apply plugin: 'com.github.hierynomus.license'
    apply plugin: 'jacoco'
    apply plugin: 'com.netflix.nebula.maven-publish'
    apply plugin: 'signing'
    apply plugin: 'org.scoverage'
    apply plugin: 'org.owasp.dependencycheck'

    configurations {
        mockitoAgent {
            canBeConsumed = false
            transitive = false
        }
    }

    dependencies {
        jaxb "org.glassfish.jaxb:jaxb-xjc"
        jaxb "org.glassfish.jaxb:jaxb-runtime"
        jaxb "jakarta.xml.bind:jakarta.xml.bind-api"
        jaxb "org.jvnet.jaxb:jaxb-plugins"

        api "org.scala-lang:scala3-library_3"
        api "jakarta.xml.bind:jakarta.xml.bind-api"
        api "jakarta.annotation:jakarta.annotation-api"
        runtimeOnly "org.glassfish.jaxb:jaxb-runtime"

        testImplementation "org.spockframework:spock-junit4"
        testRuntimeOnly "org.junit.vintage:junit-vintage-engine"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
        testRuntimeOnly "org.springframework:spring-web"
        mockitoAgent "org.mockito:mockito-core"

        scoverage "org.scoverage:scalac-scoverage-runtime_$scalaMajDotMin:2.5.2"

    }

    testSets {
        integrationTest
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgumentProviders.add({
            ["-javaagent:${configurations.mockitoAgent.singleFile.absolutePath}"]
        } as CommandLineArgumentProvider)
    }

    check.dependsOn integrationTest
    integrationTest.mustRunAfter test

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
    }

    // Compile maintained application and checker sources against Java 27 APIs.
    tasks.withType(ScalaCompile).configureEach {
        scalaCompileOptions.additionalParameters = ['-release:27', '-source:3.0-migration']
    }

    task transformXSDs() {
        description "Runs xml through an xslt transform"
        ext.outputDir = "$buildDir/src/generated-xsd"
        def xsltFile = "$rootDir/repose-aggregator/src/config/xsl/remove-1.1-elements.xsl"
        def schemaBaseDir = "$projectDir/src/main/resources/META-INF/schema"

        //If they set a property for the jaxbXSLT file override our default
        if (project.hasProperty('jaxbXsltFile')) {
            xsltFile = project.jaxbXsltFile
        }

        if (project.hasProperty('jaxbSchemaBase')) {
            schemaBaseDir = project.jaxbSchemaBase
        }

        inputs.files(
            fileTree(dir: schemaBaseDir, includes: ["**/*.xsd", "**/*.xjb"]),
            file(xsltFile)
        )
        outputs.dir outputDir

        doLast {
            file(outputDir).mkdirs()

            //Find all XSDs in the src/main/resources/META-INF.schema
            if (file(xsltFile).exists() && file(schemaBaseDir).exists()) {
                logger.info("Transforming Schemas")
                ant.xslt(
                    extension: '.xsd',
                    basedir: schemaBaseDir,
                    includes: "**/*.xsd",
                    excludes: "**/system-model.xsd",
                    style: xsltFile,
                    destdir: "${outputDir}"
                )
            } else {
                logger.info("NOT Transforming Schemas")
                copy {
                    from schemaBaseDir
                    into outputDir
                    include "**/*.xsd"
                    exclude "**/examples"
                }
            }

            //Copy over any bindings.xjb into their appropriate directories
            logger.info("Copying xjb's")
            copy {
                from schemaBaseDir
                into outputDir
                include "**/*.xjb"
                exclude "**/examples"
            }
        }
    }

    def generatedDir = "${buildDir}/src/generated-sources"

    xjc {
        dependsOn transformXSDs
        schemaDirectory = file(transformXSDs.outputDir)
        destinationDirectory = file(generatedDir)
    }

    sourceSets {
        generated {
            java {
                srcDirs += generatedDir
            }
        }
        main {
            output.dir([builtBy: 'compileGeneratedJava'], sourceSets.generated.java.classesDirectory)
            compileClasspath += files([sourceSets.generated.java.classesDirectory])
            runtimeClasspath += files([sourceSets.generated.java.classesDirectory])
            java {
                exclude '**/*.jaxb'
                exclude '**/README'
            }
        }
        test {
            compileClasspath += files([sourceSets.generated.java.classesDirectory])
            runtimeClasspath += files([sourceSets.generated.java.classesDirectory])
        }
        integrationTest {
            compileClasspath += files([sourceSets.generated.java.classesDirectory])
            runtimeClasspath += files([sourceSets.generated.java.classesDirectory])
        }
    }

    compileJava.dependsOn compileGeneratedJava
    compileScala.dependsOn compileGeneratedJava
    compileIntegrationTestGroovy.dependsOn compileGeneratedJava

    dependencies {
        generatedImplementation "jakarta.xml.bind:jakarta.xml.bind-api"
        generatedImplementation "org.jvnet.jaxb:jaxb-plugins-runtime"
    }

    [JavaCompile, ScalaCompile, GroovyCompile].collect { type ->
        tasks.withType(type) {
            dependsOn('xjc')
        }
    }

    configurations {
        testCompileOnly.extendsFrom compileOnly
        testRuntimeOnly.extendsFrom compileOnly
        integrationTestCompileOnly.extendsFrom compileOnly
        integrationTestRuntimeOnly.extendsFrom compileOnly

        api.exclude group: 'commons-logging', module: 'commons-logging'

        testImplementation.exclude group: 'xerces', module: 'xerces'
    }

    checkstyle {
        toolVersion = "14.4.0"
        configFile = file("$rootDir/repose-aggregator/src/config/styles/checkstyle.xml")
        sourceSets = sourceSets.matching {it.name != 'generated'}
    }

    codenarc {
        configFile = file("$rootDir/repose-aggregator/src/config/styles/codenarc.xml")
        sourceSets = sourceSets.matching {it.name != 'generated'}
        toolVersion = "4.0.0"
    }

    //todo: write a good one of these plugins, because this is garbage
    scalastyle {
        config = file("$rootDir/repose-aggregator/src/config/styles/scalastyle_config.xml")
        failOnWarning = true
    }

    license {
        header file("$rootDir/repose-aggregator/src/config/license/LICENSE.txt")
        mapping {
            scala = 'SLASHSTAR_STYLE'
        }
        exclude "**/*.cfg.xml"
        exclude "**/log4j2*.xml"
        sourceSets = sourceSets.matching {it.name != 'generated'}
    }

    //todo: for some reason jacoco freaks when we do clean and build together
    jacoco {
        toolVersion = "0.8.16"
    }

    scoverage {
        scoverageVersion = '2.5.2'
    }

    jacocoTestReport {
        afterEvaluate {
            sourceDirectories.setFrom files([sourceSets.main.java.srcDirs, sourceSets.generated.java.srcDirs])
            classDirectories.setFrom files([sourceSets.main.java.classesDirectory, sourceSets.generated.java.classesDirectory])
            classDirectories.setFrom files(classDirectories.files.collect { classDirectory ->
                fileTree(dir: classDirectory, excludes: ['**/ObjectFactory.class'])
            })
        }
    }

    test {
        jacoco {
            destinationFile = file("$buildDir/jacoco/jacocoTest.exec")
        }
    }

    integrationTest {
        jacoco {
            destinationFile = file("$buildDir/jacoco/jacocoIntegrationTest.exec")
        }
        systemProperty 'jacocoArguments', jacoco.getAsJvmArg()

        if (project.hasProperty('javaArguments')) {
            systemProperty 'javaArguments', project.getProperty('javaArguments')
        }
    }

    dependencyCheck {
        scanConfigurations = [
            'compileClasspath',
            'runtimeClasspath',
        ]
        analyzers {
            assemblyEnabled = false
        }
        suppressionFile = "${rootDir}/repose-aggregator/src/config/dependency-check/OWASP-Suppression.xml"

        // Configures the dependencyCheck plugin to fail the build if any vulnerability is found
        failBuildOnCVSS = 0
    }

    jar {
        manifest {
            attributes(
                    "Specification-Title": "Repose Components - $project.name",
                    "Specification-Vendor": "Rackspace US, Inc.",
                    "Specification-Version": version,
                    "Implementation-Title": "Repose Components - $project.name",
                    "Implementation-Version": version,
                    "Implementation-Vendor": "Rackspace US, Inc.",
                    "Implementation-Vendor-Id": project.group,
                    "Built-By": System.getProperty('user.name'),
                    "Build-Jdk": org.gradle.internal.jvm.Jvm.current(),
                    "Created-By": "Gradle $project.gradle.gradleVersion",
            )
        }
    }

    idea {
        module {
            sourceDirs += file("$generatedDir")
            generatedSourceDirs += file("$generatedDir")
        }
    }

    publishing {
        repositories {
            maven {
                name 'reposeNexus'
                if (project.hasProperty('release')) {
                    url 'https://maven.research.rackspacecloud.com/content/repositories/releases'
                } else {
                    url 'https://maven.research.rackspacecloud.com/content/repositories/snapshots'
                }
                credentials {
                    username project.hasProperty('maven.repo.username') ? property('maven.repo.username') : 'Need to provide an actual username'
                    password project.hasProperty('maven.repo.password') ? property('maven.repo.password') : 'Need to provide an actual password'
                }
            }
        }

        publications {
            nebula(MavenPublication) {
                if(project.hasProperty('release')) {
                    signArchives.signatures.findAll({!it.toSign.canonicalPath.contains("deb") && !it.toSign.canonicalPath.contains("rpm")}).each {
                        artifact source: it, extension: 'asc'
                    }
                }

                //when we include the signature it tries to switch the packaging in the pom to pom,
                // i just remove it here, because the default in maven is jar if you don't specify,
                // so i can go fix it only where it needs it
                pom.withXml { XmlProvider xml ->
                    def root = xml.asNode()
                    root.get("packaging").each { root.remove(it) }
                }
            }
        }
    }

    signing {
        required { gradle.taskGraph.hasTask("publish") }
        sign configurations.archives
    }

    if (project.hasProperty("minCoverageRatio")) {
        def minCoverageRatio = (project.findProperty("minCoverageRatio") ?: "0.75") as double

        // Configure the JaCoCo test coverage verification
        jacocoTestCoverageVerification {
            violationRules {
                rule {
                    limit {
                        minimum = minCoverageRatio
                    }
                }
            }
            afterEvaluate {
                sourceDirectories.setFrom files([sourceSets.main.java.srcDirs, sourceSets.generated.java.srcDirs])
                classDirectories.setFrom files([sourceSets.main.java.classesDirectory, sourceSets.generated.java.classesDirectory])
                classDirectories.setFrom files(classDirectories.files.collect { classDirectory ->
                    fileTree(dir: classDirectory, excludes: ['**/ObjectFactory.class'])
                })
            }
        }

        // Configure the Scoverage test coverage verification
        scoverage {
            minimumRate = minCoverageRatio
        }

        // Wire in test coverage verification tasks
        //
        // Note: To take advantage of Scoverage aggregation, the check dependency on
        // Scoverage was placed in the repose-aggregator sub-project.
        check.dependsOn jacocoTestCoverageVerification
    }

    buildAll.dependsOn build
    publish.dependsOn buildAll
    project.tasks.getByPath(':release').dependsOn publish
}

dependencyRecommendations {
    map recommendations: catalogRecommendations
}
